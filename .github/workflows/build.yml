name: Build AunSSH Mini

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install pyinstaller paramiko PyQt6

      - name: Build
        run: pyinstaller --onefile --windowed --noconsole --name="AunSSH-Mini" aunssh_mini.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AunSSH-Mini-windows
          path: dist/AunSSH-Mini.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AunSSH-Mini.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0 libdbus-1-3 libxcb-cursor0

      - name: Install Python deps
        run: pip install pyinstaller paramiko PyQt6

      - name: Build
        run: pyinstaller --onefile --windowed --name="AunSSH-Mini" aunssh_mini.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AunSSH-Mini-linux
          path: dist/AunSSH-Mini

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AunSSH-Mini
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
